x-shared-volume: &shared-volume
  - ./app:/goalStatApi/app
  - ./etc/ssl/certs:/etc/ssl/certs

services:

  app:
    build: .
    volumes: *shared-volume
    ports:
      - "8000:8000"
    container_name: goalStatApi
    depends_on:
      - redis
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  redis:
    image: "redis:alpine"  


  worker:
    build: .
    volumes: *shared-volume
    depends_on:
      - redis
    command: ["celery", "-A", "app.tasks", "worker", "-B","--loglevel=info"]
  

  flower:
    build: .
    volumes: *shared-volume
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    command: ["celery", "-A", "app.tasks", "flower", "--broker=redis://redis:6379/0"]
    
